<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Study Planner</h1>
      <p>Add your tasks, see what is urgent, export the schedule.</p>
    </div>
    <button type="button" id="quit-button" class="btn quiet">Stop planner</button>
  </header>

  <main class="layout" id="main-area">
    <section class="panel form-panel" aria-labelledby="form-title">
      <h2 id="form-title">New task</h2>
      <form id="task-form" novalidate>
        <div class="field">
          <label for="task-name">Task name</label>
          <input id="task-name" type="text" maxlength="80" autocomplete="off">
        </div>
        <div class="field">
          <label for="task-subject">Subject</label>
          <input id="task-subject" type="text" maxlength="50" autocomplete="off">
        </div>
        <div class="field">
          <label for="task-date">Due date</label>
          <input id="task-date" type="date">
        </div>
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <p id="form-message" class="message" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn primary">Add task</button>
      </form>
    </section>

    <section class="panel schedule-panel" aria-labelledby="schedule-title">
      <div class="schedule-head">
        <h2 id="schedule-title">Schedule</h2>
        <div class="actions">
          <button type="button" id="export-pdf" class="btn">Save as PDF</button>
          <button type="button" id="export-image" class="btn">Save as image</button>
        </div>
      </div>
      <p id="export-message" class="message" role="status" aria-live="polite"></p>

      <div class="table-wrap">
        <table id="task-table">
          <thead>
            <tr>
              <th scope="col">Task</th>
              <th scope="col">Subject</th>
              <th scope="col">Due</th>
              <th scope="col">Priority</th>
              <th scope="col" class="col-action"><span class="sr-only">Delete</span></th>
            </tr>
          </thead>
          <tbody id="task-body"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty">Nothing scheduled yet. Add your first task on the left.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
